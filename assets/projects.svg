<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" width="1000" height="900" role="img" aria-label="Selected projects by Hammad Ehsan Ullah">
<title>Selected projects by Hammad Ehsan Ullah</title>
<desc>Eight project cards covering AI security, agentic systems, real-time products, SaaS, and applied machine learning.</desc>
<defs>
  <linearGradient id="p_border" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#247bff"/><stop offset=".55" stop-color="#263452"/><stop offset="1" stop-color="#ff354f"/></linearGradient>
  <linearGradient id="p_glow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#247bff"/><stop offset="1" stop-color="#ff354f"/></linearGradient>
  <pattern id="p_dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1a2440"/></pattern>
  <filter id="p_shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".28"/></filter>
  <style>
    .sans{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:"JetBrains Mono",Consolas,monospace}.title{font-weight:800;letter-spacing:.4px}.card{animation:rise .7s ease both}.c2{animation-delay:.06s}.c3{animation-delay:.12s}.c4{animation-delay:.18s}.c5{animation-delay:.24s}.c6{animation-delay:.30s}.c7{animation-delay:.36s}.c8{animation-delay:.42s}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.card{animation:none}}
  </style>
</defs>
<rect width="1000" height="900" rx="26" fill="#070b16"/><rect width="1000" height="900" rx="26" fill="url(#p_dots)"/><rect x="1" y="1" width="998" height="898" rx="25" fill="none" stroke="url(#p_border)" stroke-width="1.5"/>
<rect width="500" height="5" fill="#247bff"/><rect x="500" width="500" height="5" fill="#ff354f"/>
<text x="44" y="44" class="mono" font-size="12" letter-spacing="2.5" fill="#8d97b5">/ 04  SELECTED WORK</text>
<text x="44" y="112" class="sans title" font-size="58" fill="#f2f5ff">PROJECTS<tspan fill="#247bff">.</tspan></text>
<text x="956" y="88" text-anchor="end" class="mono" font-size="12" fill="#8d97b5">BUILD → SHIP → LEARN → REPEAT</text>
<rect x="44" y="132" width="912" height="2" rx="1" fill="url(#p_glow)" opacity=".65"/>

<!-- Row 1 -->
<g class="card" filter="url(#p_shadow)"><rect x="44" y="158" width="442" height="158" rx="20" fill="#0d1424" stroke="#247bff" stroke-opacity=".7"/><rect x="44" y="158" width="6" height="158" rx="3" fill="#247bff"/><text x="70" y="191" class="mono" font-size="10" letter-spacing="2" fill="#247bff">01 / AI SECURITY</text><text x="70" y="226" class="sans title" font-size="24" fill="#f2f5ff">VulnGuard AI</text><rect x="356" y="176" width="104" height="24" rx="12" fill="#102a54"/><text x="408" y="192" text-anchor="middle" class="mono" font-size="10" fill="#69a6ff">DEPLOYED</text><text x="70" y="253" class="sans" font-size="13" fill="#aeb8d3">Claude-powered Solidity vulnerability scanner</text><text x="70" y="273" class="sans" font-size="13" fill="#aeb8d3">with instant audit reports for Web3 teams.</text><text x="70" y="298" class="mono" font-size="10" fill="#657291">NEXT.JS  TYPESCRIPT  CLAUDE  SOLIDITY</text></g>
<g class="card c2" filter="url(#p_shadow)"><rect x="514" y="158" width="442" height="158" rx="20" fill="#0d1424" stroke="#ff354f" stroke-opacity=".7"/><rect x="950" y="158" width="6" height="158" rx="3" fill="#ff354f"/><text x="540" y="191" class="mono" font-size="10" letter-spacing="2" fill="#ff5b70">02 / PRODUCT STUDIO</text><text x="540" y="226" class="sans title" font-size="24" fill="#f2f5ff">CodeBuddy</text><rect x="824" y="176" width="106" height="24" rx="12" fill="#3a1520"/><text x="877" y="192" text-anchor="middle" class="mono" font-size="10" fill="#ff8291">TEAM LEAD</text><text x="540" y="253" class="sans" font-size="13" fill="#aeb8d3">AI-powered execution studio from validation</text><text x="540" y="273" class="sans" font-size="13" fill="#aeb8d3">through launch, automation, and growth.</text><text x="540" y="298" class="mono" font-size="10" fill="#657291">AI AUTOMATION  PRODUCT ENGINEERING</text></g>

<!-- Row 2 -->
<g class="card c3" filter="url(#p_shadow)"><rect x="44" y="336" width="442" height="158" rx="20" fill="#0d1424" stroke="#1c2742"/><rect x="44" y="336" width="6" height="158" rx="3" fill="#ff354f"/><text x="70" y="369" class="mono" font-size="10" letter-spacing="2" fill="#ff5b70">03 / REAL-TIME AI</text><text x="70" y="404" class="sans title" font-size="24" fill="#f2f5ff">CopilotMeet</text><rect x="386" y="354" width="74" height="24" rx="12" fill="#3a1520"/><text x="423" y="370" text-anchor="middle" class="mono" font-size="10" fill="#ff8291">BETA</text><text x="70" y="431" class="sans" font-size="13" fill="#aeb8d3">Sub-300ms interview copilot with live speech,</text><text x="70" y="451" class="sans" font-size="13" fill="#aeb8d3">in-memory vector RAG, and OpenRouter LLMs.</text><text x="70" y="476" class="mono" font-size="10" fill="#657291">DEEPGRAM  SUPABASE  OPENROUTER  RAG</text></g>
<g class="card c4" filter="url(#p_shadow)"><rect x="514" y="336" width="442" height="158" rx="20" fill="#0d1424" stroke="#1c2742"/><rect x="950" y="336" width="6" height="158" rx="3" fill="#247bff"/><text x="540" y="369" class="mono" font-size="10" letter-spacing="2" fill="#247bff">04 / AGENTIC SYSTEMS</text><text x="540" y="404" class="sans title" font-size="24" fill="#f2f5ff">Autonomous Trading Agent</text><rect x="826" y="354" width="104" height="24" rx="12" fill="#102a54"/><text x="878" y="370" text-anchor="middle" class="mono" font-size="10" fill="#69a6ff">DEPLOYED</text><text x="540" y="431" class="sans" font-size="13" fill="#aeb8d3">Multi-step LangGraph decision workflows for</text><text x="540" y="451" class="sans" font-size="13" fill="#aeb8d3">live market execution and signal generation.</text><text x="540" y="476" class="mono" font-size="10" fill="#657291">LANGGRAPH  PYTHON  MQL5  FASTAPI</text></g>

<!-- Row 3 -->
<g class="card c5" filter="url(#p_shadow)"><rect x="44" y="514" width="442" height="158" rx="20" fill="#0d1424" stroke="#1c2742"/><rect x="44" y="514" width="6" height="158" rx="3" fill="#247bff"/><text x="70" y="547" class="mono" font-size="10" letter-spacing="2" fill="#247bff">05 / MARKET DATA</text><text x="70" y="582" class="sans title" font-size="24" fill="#f2f5ff">Real-Time Stock Signals</text><rect x="356" y="532" width="104" height="24" rx="12" fill="#102a54"/><text x="408" y="548" text-anchor="middle" class="mono" font-size="10" fill="#69a6ff">DEPLOYED</text><text x="70" y="609" class="sans" font-size="13" fill="#aeb8d3">Technical indicators, WebSocket feeds, and</text><text x="70" y="629" class="sans" font-size="13" fill="#aeb8d3">Telegram alert delivery for active traders.</text><text x="70" y="654" class="mono" font-size="10" fill="#657291">PYTHON  FASTAPI  REDIS  WEBSOCKET</text></g>
<g class="card c6" filter="url(#p_shadow)"><rect x="514" y="514" width="442" height="158" rx="20" fill="#0d1424" stroke="#1c2742"/><rect x="950" y="514" width="6" height="158" rx="3" fill="#ff354f"/><text x="540" y="547" class="mono" font-size="10" letter-spacing="2" fill="#ff5b70">06 / B2B SAAS</text><text x="540" y="582" class="sans title" font-size="24" fill="#f2f5ff">Time Tracker SaaS</text><rect x="826" y="532" width="104" height="24" rx="12" fill="#3a1520"/><text x="878" y="548" text-anchor="middle" class="mono" font-size="10" fill="#ff8291">DEPLOYED</text><text x="540" y="609" class="sans" font-size="13" fill="#aeb8d3">Multi-tenant tracking with billing, invoicing,</text><text x="540" y="629" class="sans" font-size="13" fill="#aeb8d3">and analytics dashboards for remote teams.</text><text x="540" y="654" class="mono" font-size="10" fill="#657291">NEXT.JS  NODE.JS  POSTGRESQL  STRIPE</text></g>

<!-- Row 4 -->
<g class="card c7" filter="url(#p_shadow)"><rect x="44" y="692" width="442" height="158" rx="20" fill="#0d1424" stroke="#1c2742"/><rect x="44" y="692" width="6" height="158" rx="3" fill="#ff354f"/><text x="70" y="725" class="mono" font-size="10" letter-spacing="2" fill="#ff5b70">07 / MESSAGING</text><text x="70" y="760" class="sans title" font-size="24" fill="#f2f5ff">AnonyChat</text><rect x="356" y="710" width="104" height="24" rx="12" fill="#3a1520"/><text x="408" y="726" text-anchor="middle" class="mono" font-size="10" fill="#ff8291">DEPLOYED</text><text x="70" y="787" class="sans" font-size="13" fill="#aeb8d3">Anonymous encrypted messaging with admin</text><text x="70" y="807" class="sans" font-size="13" fill="#aeb8d3">controls and WebSocket-based delivery.</text><text x="70" y="832" class="mono" font-size="10" fill="#657291">REACT  NODE.JS  SOCKET.IO  MONGODB</text></g>
<g class="card c8" filter="url(#p_shadow)"><rect x="514" y="692" width="442" height="158" rx="20" fill="#0d1424" stroke="#1c2742"/><rect x="950" y="692" width="6" height="158" rx="3" fill="#247bff"/><text x="540" y="725" class="mono" font-size="10" letter-spacing="2" fill="#247bff">08 / APPLIED ML</text><text x="540" y="760" class="sans title" font-size="24" fill="#f2f5ff">AI Resume Screening</text><rect x="806" y="710" width="124" height="24" rx="12" fill="#102a54"/><text x="868" y="726" text-anchor="middle" class="mono" font-size="10" fill="#69a6ff">RESEARCH</text><text x="540" y="787" class="sans" font-size="13" fill="#aeb8d3">NLP candidate ranking with deep learning,</text><text x="540" y="807" class="sans" font-size="13" fill="#aeb8d3">ATS integration, and automated scoring.</text><text x="540" y="832" class="mono" font-size="10" fill="#657291">PYTHON  TENSORFLOW  NLP  SCIKIT-LEARN</text></g>
<text x="500" y="878" text-anchor="middle" class="mono" font-size="10" letter-spacing="2" fill="#4c5879">PRODUCTION SYSTEMS · MEASURABLE OUTCOMES · CLEAN ARCHITECTURE</text>
</svg>
